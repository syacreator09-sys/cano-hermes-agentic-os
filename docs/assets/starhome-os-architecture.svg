<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de StarHome OS</title>
  <desc id="desc">Diagrama oficial del sistema operativo agéntico autónomo StarHome OS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b14"/><stop offset="0.55" stop-color="#081827"/><stop offset="1" stop-color="#090d1b"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102a41" stop-opacity="0.9"/><stop offset="1" stop-color="#0a1726" stop-opacity="0.92"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d5ea3"/><stop offset="0.5" stop-color="#123b76"/><stop offset="1" stop-color="#4b1d70"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#2bd8ff" stop-opacity="0.9"/><stop offset="0.45" stop-color="#1686ff" stop-opacity="0.35"/><stop offset="1" stop-color="#1686ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#61bfff" stroke-opacity="0.055" stroke-width="1"/></pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
    <style>
      .title{font:700 58px Inter,Segoe UI,Arial,sans-serif;letter-spacing:3px;fill:#f3f8ff}.subtitle{font:500 26px Inter,Segoe UI,Arial,sans-serif;fill:#75c9ff}.tagline{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#aabbd0}.section{font:700 15px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.2px;fill:#7ad7ff}.module-title{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#f6fbff}.module-sub{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#6ecfff}.body{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#b9c8d9}.body-sm{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#96abc0}.agent{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#f4f7ff}.metric-label{font:600 10px Inter,Segoe UI,Arial,sans-serif;fill:#7496b7;letter-spacing:.8px}.metric-value{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#68e8ff}.panel{fill:url(#panel);stroke:#1f79a8;stroke-opacity:.7;stroke-width:1.2}.module{fill:#0b2033;stroke:#5ed8ff;stroke-opacity:.85;stroke-width:1.5}.connector{stroke:#42cfff;stroke-width:2;stroke-opacity:.8;fill:none}.dash{stroke:#9c7dff;stroke-width:1.5;stroke-dasharray:5 7;stroke-opacity:.7;fill:none}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="12" y="12" width="1576" height="876" rx="18" fill="none" stroke="#7bdcff" stroke-opacity="0.35"/>
  <text x="42" y="76" class="title">STARHOME OS</text><text x="44" y="113" class="subtitle">Sistema Operativo Agéntico Autónomo</text><text x="44" y="143" class="tagline">Orquesta agentes, memoria, contenido y operaciones desde un solo centro.</text>
  <g transform="translate(678 24)"><rect width="875" height="64" rx="12" class="panel"/><g transform="translate(24 15)"><text class="metric-label">ESTADO</text><circle cx="7" cy="30" r="5" fill="#45e0c4"/><text x="20" y="35" class="body">ÓPTIMO</text></g><g transform="translate(175 15)"><text class="metric-label">AGENTES ACTIVOS</text><text y="35" class="metric-value">12 / 12</text></g><g transform="translate(345 15)"><text class="metric-label">TAREAS EN CURSO</text><text y="35" class="metric-value">24</text></g><g transform="translate(520 15)"><text class="metric-label">CARGA</text><text y="35" class="metric-value">32%</text></g><g transform="translate(660 15)"><text class="metric-label">MODO</text><text y="35" class="body">SUPERVISADO</text></g></g>
  <g transform="translate(30 180)"><rect width="285" height="500" rx="14" class="panel" filter="url(#shadow)"/><text x="20" y="34" class="section">CAPACIDADES CLAVE</text><g transform="translate(18 54)"><g><rect width="249" height="72" rx="10" fill="#0b2237" stroke="#1f5879"/><circle cx="26" cy="25" r="11" fill="#123d61"/><text x="47" y="25" class="module-title" style="font-size:15px">Memoria conectada</text><text x="47" y="46" class="body-sm">Contexto persistente y conocimiento útil.</text></g><g transform="translate(0 82)"><rect width="249" height="72" rx="10" fill="#0b2237" stroke="#1f5879"/><circle cx="26" cy="25" r="11" fill="#123d61"/><text x="47" y="25" class="module-title" style="font-size:15px">Creación de agentes</text><text x="47" y="46" class="body-sm">Diseña, prueba y despliega capacidades.</text></g><g transform="translate(0 164)"><rect width="249" height="72" rx="10" fill="#0b2237" stroke="#1f5879"/><circle cx="26" cy="25" r="11" fill="#123d61"/><text x="47" y="25" class="module-title" style="font-size:15px">Router multmodelo</text><text x="47" y="46" class="body-sm">Elige costo, potencia y proveedor.</text></g><g transform="translate(0 246)"><rect width="249" height="72" rx="10" fill="#0b2237" stroke="#1f5879"/><circle cx="26" cy="25" r="11" fill="#123d61"/><text x="47" y="25" class="module-title" style="font-size:15px">Autonomía supervisada</text><text x="47" y="46" class="body-sm">Políticas, límites y aprobación humana.</text></g><g transform="translate(0 328)"><rect width="249" height="72" rx="10" fill="#0b2237" stroke="#1f5879"/><circle cx="26" cy="25" r="11" fill="#123d61"/><text x="47" y="25" class="module-title" style="font-size:15px">Dashboard amigable</text><text x="47" y="46" class="body-sm">Control visual, métricas y revisión.</text></g></g></g>
  <g transform="translate(330 160)"><ellipse cx="460" cy="360" rx="410" ry="310" fill="url(#glow)" opacity=".32"/><path d="M460 285V178" class="connector"/><path d="M376 320L245 255" class="connector"/><path d="M544 320L675 255" class="connector"/><path d="M376 405L245 475" class="connector"/><path d="M544 405L675 475" class="connector"/><path d="M460 440V550" class="connector"/><circle cx="460" cy="365" r="116" fill="url(#core)" stroke="#70e7ff" stroke-width="2.5" filter="url(#softGlow)"/><circle cx="460" cy="365" r="92" fill="#0a1930" stroke="#237bd8" stroke-width="1.5"/><polygon points="460,305 510,334 510,392 460,421 410,392 410,334" fill="none" stroke="#6ee7ff" stroke-width="3"/><circle cx="460" cy="363" r="28" fill="#123c72" stroke="#70e7ff"/><text x="460" y="461" text-anchor="middle" class="module-title" style="font-size:26px">Conductor</text><text x="460" y="484" text-anchor="middle" class="module-sub">Orquestador central</text><text x="460" y="506" text-anchor="middle" class="body-sm">Coordina · Decide · Delega · Verifica</text>
    <g transform="translate(350 80)"><rect width="220" height="108" rx="14" class="module"/><text x="110" y="34" text-anchor="middle" class="module-title">Nexus</text><text x="110" y="54" text-anchor="middle" class="module-sub">Memoria &amp; conocimiento</text><text x="18" y="78" class="body-sm">• Obsidian + Graphify</text><text x="18" y="96" class="body-sm">• Context Builder</text></g><g transform="translate(110 205)"><rect width="220" height="108" rx="14" class="module"/><text x="110" y="34" text-anchor="middle" class="module-title">Forge</text><text x="110" y="54" text-anchor="middle" class="module-sub">Creación &amp; automatización</text><text x="18" y="78" class="body-sm">• Agentes, skills y MCP</text><text x="18" y="96" class="body-sm">• Evals y cuarentena</text></g><g transform="translate(590 205)"><rect width="220" height="108" rx="14" class="module"/><text x="110" y="34" text-anchor="middle" class="module-title">Radar</text><text x="110" y="54" text-anchor="middle" class="module-sub">Inteligencia &amp; entorno</text><text x="18" y="78" class="body-sm">• Tendencias y señales</text><text x="18" y="96" class="body-sm">• Alertas y oportunidades</text></g><g transform="translate(110 425)"><rect width="220" height="108" rx="14" class="module"/><text x="110" y="34" text-anchor="middle" class="module-title">Executors</text><text x="110" y="54" text-anchor="middle" class="module-sub">Ejecución &amp; operaciones</text><text x="18" y="78" class="body-sm">• Workflows y herramientas</text><text x="18" y="96" class="body-sm">• Workers aislados</text></g><g transform="translate(590 425)"><rect width="220" height="108" rx="14" class="module"/><text x="110" y="34" text-anchor="middle" class="module-title">Governance</text><text x="110" y="54" text-anchor="middle" class="module-sub">Políticas &amp; seguridad</text><text x="18" y="78" class="body-sm">• Permisos y auditoría</text><text x="18" y="96" class="body-sm">• Presupuestos y aprobación</text></g><g transform="translate(350 540)"><rect width="220" height="108" rx="14" class="module"/><text x="110" y="34" text-anchor="middle" class="module-title">UI</text><text x="110" y="54" text-anchor="middle" class="module-sub">Interfaz &amp; experiencia</text><text x="18" y="78" class="body-sm">• Dashboard unificado</text><text x="18" y="96" class="body-sm">• Control y revisión humana</text></g>
    <g><path d="M350 125L260 85" class="dash"/><circle cx="225" cy="68" r="48" fill="#11172d" stroke="#8d6cff"/><text x="225" y="64" text-anchor="middle" class="agent">Claude</text><text x="225" y="80" text-anchor="middle" class="agent">Architect</text></g><g><path d="M570 125L660 85" class="dash"/><circle cx="695" cy="68" r="48" fill="#11172d" stroke="#8d6cff"/><text x="695" y="64" text-anchor="middle" class="agent">Kimi</text><text x="695" y="80" text-anchor="middle" class="agent">Researcher</text></g><g><path d="M110 260L60 260" class="dash"/><circle cx="20" cy="260" r="48" fill="#11172d" stroke="#8d6cff"/><text x="20" y="256" text-anchor="middle" class="agent">Codex</text><text x="20" y="272" text-anchor="middle" class="agent">Builder</text></g><g><path d="M810 260L860 260" class="dash"/><circle cx="900" cy="260" r="48" fill="#11172d" stroke="#8d6cff"/><text x="900" y="256" text-anchor="middle" class="agent">Trend</text><text x="900" y="272" text-anchor="middle" class="agent">Radar</text></g><g><path d="M110 480L60 505" class="dash"/><circle cx="18" cy="525" r="48" fill="#11172d" stroke="#8d6cff"/><text x="18" y="521" text-anchor="middle" class="agent">Infra</text><text x="18" y="537" text-anchor="middle" class="agent">Operator</text></g><g><path d="M810 480L860 505" class="dash"/><circle cx="902" cy="525" r="48" fill="#11172d" stroke="#8d6cff"/><text x="902" y="521" text-anchor="middle" class="agent">Security</text><text x="902" y="537" text-anchor="middle" class="agent">Guardian</text></g>
  </g>
  <g transform="translate(1250 110)"><rect width="315" height="190" rx="14" fill="#13112a" stroke="#8f63d8" stroke-opacity=".8"/><text x="20" y="34" class="section" fill="#c6a9ff">SIGNIFICADO DEL NOMBRE</text><text x="20" y="78" class="module-title" style="font-size:17px">Star</text><text x="68" y="78" class="body">= visión, guía y expansión.</text><text x="20" y="116" class="module-title" style="font-size:17px">Home</text><text x="73" y="116" class="body">= base operativa, control y memoria.</text><circle cx="262" cy="148" r="27" fill="#123c72" stroke="#71e6ff"/><path d="M245 150L262 135L279 150V170H245Z" fill="none" stroke="#71e6ff" stroke-width="2"/></g>
  <g transform="translate(1250 320)"><rect width="315" height="145" rx="14" class="panel"/><text x="20" y="34" class="section">MOTORES</text><text x="20" y="70" class="body">Claude Code · Codex · Kimi</text><text x="20" y="94" class="body">DeepSeek · OpenAI · Grok · Qwen</text></g><g transform="translate(1250 485)"><rect width="315" height="155" rx="14" class="panel"/><text x="20" y="34" class="section">INTEGRACIONES</text><text x="20" y="70" class="body">Factory V5 · Command Center</text><text x="20" y="94" class="body">Supabase · Cloudflare · Modal</text><text x="20" y="118" class="body">WhatsApp · Telegram</text></g><g transform="translate(1250 660)"><rect width="315" height="175" rx="14" class="panel"/><text x="20" y="34" class="section">ARQUITECTURA EN CAPAS</text><g transform="translate(20 55)"><path d="M0 20L75 0L150 20L75 40Z" fill="#174b88" stroke="#59d9ff"/><path d="M0 48L75 28L150 48L75 68Z" fill="#143c74" stroke="#4ea5ff"/><path d="M0 76L75 56L150 76L75 96Z" fill="#202f6c" stroke="#7669ff"/><path d="M0 104L75 84L150 104L75 124Z" fill="#271f54" stroke="#916cff"/><text x="172" y="20" class="body-sm">01 · Interfaz</text><text x="172" y="48" class="body-sm">02 · Orquestación</text><text x="172" y="76" class="body-sm">03 · Servicios</text><text x="172" y="104" class="body-sm">04 · Infraestructura</text></g></g>
  <g transform="translate(30 850)"><rect width="1535" height="32" rx="10" fill="#07111d" stroke="#1d4058"/><text x="20" y="22" class="section">STARHOME OS</text><text x="250" y="22" class="body-sm">DASHBOARD</text><text x="390" y="22" class="body-sm">AGENTES</text><text x="510" y="22" class="body-sm">MEMORIA</text><text x="630" y="22" class="body-sm">OPERACIONES</text><text x="785" y="22" class="body-sm">ANALYTICS</text><text x="920" y="22" class="body-sm">CONFIGURACIÓN</text><circle cx="1445" cy="16" r="5" fill="#45e0c4"/><text x="1460" y="21" class="body-sm">Conectado</text></g>
