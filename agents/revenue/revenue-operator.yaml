  network: allowlist
  production: approval-required
  external_write: prohibited
  communications: approval-required
  crm_write: approval-required
budget:
  max_cost_usd: 0.25
  max_turns: 14
  timeout_seconds: 900
evaluations:
- schema
- safety
- task-contract
- customer-data-boundary
max_concurrency: 1
