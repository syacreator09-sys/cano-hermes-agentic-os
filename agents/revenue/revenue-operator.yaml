  - recommend_next_action
  - draft_proposal
  - review_pipeline
  approval_required:
  - send_message
  - update_crm
  - schedule_meeting
  - issue_quote
  prohibited:
  - sign_agreement
  - charge_customer
  - expose_customer_data
permissions:
