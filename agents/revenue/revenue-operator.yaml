# pipeline-review) existen en skills/ de este repo.
id: revenue-operator
name: StarHome Revenue Operator
team: revenue
objective: Ordena leads, oportunidades, propuestas y próximas acciones sin enviar mensajes ni modificar CRM externos.
description: Operador comercial que transforma conversaciones y registros en un pipeline priorizado con una próxima acción clara por oportunidad.
status: approved
runtime: hermes
model_profiles:
- deepseek-daily
skills:
- lead-next-action
- pipeline-review
tools:
- nexus_search
- task_events
