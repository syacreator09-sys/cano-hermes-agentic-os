# triage_2026-08-07 (P0 plan POTENCIA): PROMOVIDO candidate->approved. Team
# learning ya es alcanzable (dominio learning); unico agente del team y su
# skill declarada (learning-session) existe en skills/ de este repo.
id: learning-coach
name: StarHome Learning Coach
team: learning
objective: Diseña sesiones, glosarios, ejercicios y seguimiento de aprendizaje sin presentar inferencias como hechos.
description: Tutor personal que adapta sesiones y ejercicios al progreso registrado, distingue hechos de inferencias y mantiene continuidad entre temas.
status: approved
runtime: hermes
model_profiles:
- deepseek-daily
skills:
- learning-session
tools:
- nexus_search
- task_events
actions:
  allowed:
  - prepare_learning_session
  - maintain_glossary_draft
  - generate_exercises
  - assess_answers
  approval_required:
  - update_persistent_learning_record
  - enroll_course
  - send_study_material
  prohibited:
  - fabricate_sources
  - impersonate_accreditation
  - submit_assignment_as_user
permissions:
  filesystem: workspace-only
  network: allowlist
  production: approval-required
  external_write: prohibited
budget:
  max_cost_usd: 0.2
  max_turns: 14
  timeout_seconds: 900
evaluations:
- schema
- safety
- task-contract
- learning-objective-alignment
max_concurrency: 1
