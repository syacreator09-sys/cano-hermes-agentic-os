name: hermes-produccion
mission: "Renderizar reels/largos/carruseles: Remotion + ffmpeg + edge-tts + MoneyPrinter stock; QA con ffprobe y runbook de calidad"
# P0 (plan POTENCIA, 2026-08-07): `hyperframes` SI existe
# (hermes-agent/optional-skills/creative/hyperframes, "Render MP4/WebM
# videos from HTML compositions") y quedo instalada en
# ~/.hermes/profiles/hermes-produccion/skills/. Las otras 6 no existen en
# ningun repo de esta maquina (la CLI de hyperframes viene dentro de la
# misma skill, no separada) -- pendientes, no borradas.
skills: [hyperframes]
skills_pendientes:
  - hyperframes-cli        # cubierta por la skill hyperframes instalada (scripts/ incluye la CLI); no existe como skill aparte
  - remotion-best-practices  # aspiracional: guia Remotion; vendria de factory-v5 (renderers/remotion)
  - ffmpeg-shorts-editing    # aspiracional: recetas ffmpeg para shorts; vendria de factory-v5
  - animated-captions        # aspiracional: subtitulos animados; vendria de factory-v5
  - shorts-export-profiles   # aspiracional: perfiles de export por plataforma; vendria de factory-v5
  - video-vision-audit       # aspiracional: QA visual con vision; vendria de factory-v5 (runbook de calidad)
scripts_factory:
  - scripts/produce_long_pilot.py
  - scripts/produce_stock_short.py
  - scripts/produce_vox_explainer.py
  - scripts/final_remotion_v2.py
  - renderers/remotion/
providers: [pexels, pixabay, coverr, elevenlabs, modal]
default_model: sonnet
budget_daily:
  credits: 0
  usd: 1
cadence: "15 10 * * *"
# K9 reconciliation (was `folder`): rendering (ffmpeg/Remotion/MoneyPrinter
# stock) is the heaviest, most dependency-laden work of the 6 offices --
# real container sandboxing (cap_drop, mem_limit, no-new-privileges) is a
# better fit than a native folder-isolated worker, and office-content's
# Docker container (infrastructure/offices/content/, F11) already exists
# with the right mounts. Reclassified so this profile maps 1:1 onto that
# real container instead of leaving it native. See K9 report for the full
# office.yaml <-> Docker office mapping table.
isolation: docker
never: [publicar, pagar, tocar_env, aprobar_gates, render_paralelo_multiple]
