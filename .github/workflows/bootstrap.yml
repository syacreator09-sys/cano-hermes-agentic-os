name: Bootstrap Cano Hermes OS
on:
  push:
    paths:
      - bootstrap_repo.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize repository
        run: python bootstrap_repo.py --force
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Validate manifests
        run: python scripts/validate.py
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Commit generated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: materialize Cano Hermes OS v0.1.0"
            git push
          fi
