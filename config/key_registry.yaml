  dominio: otro-proyecto
  uso: secreto de API de Cloudinary -- sin consumidor detectado ni patrón reconocido, sin clasificar,
    revisar con Cano
  consumidores: []
  validacion: live-free
  riesgo: alto
  rotacion_pendiente: true
  rotacion_motivo: 'Mismo chequeo que CLOUDINARY_API_KEY (comparten validador, un solo request con las
    tres credenciales): 401 ''cloud_name mismatch'', causa raiz es CLOUDINARY_CLOUD_NAME incorrecto en
    el vault, no el secreto en si. Ver motivo de CLOUDINARY_API_KEY.'
- nombre: CLOUDINARY_CLOUD_NAME
