  dominio: otro-proyecto
  uso: variable de configuración de Cloudinary Cloud NAME -- sin consumidor detectado ni patrón reconocido,
    sin clasificar, revisar con Cano
  consumidores: []
  validacion: presence-only
  riesgo: bajo
  rotacion_pendiente: true
  rotacion_motivo: 'Causa raiz del fallo de Cloudinary: este campo en el vault contiene el mismo valor
    que CLOUDINARY_API_KEY caracter por caracter (no un nombre de cuenta) -- confirmado programaticamente
    sin exponer valores. El proveedor responde 401 ''cloud_name mismatch'', consistente con un campo mal
    cargado. Cano debe reemplazarlo por el cloud_name real desde el dashboard de Cloudinary.'
