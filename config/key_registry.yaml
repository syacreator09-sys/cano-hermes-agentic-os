  rotacion_pendiente: true
  rotacion_motivo: 'GET https://api.cloudinary.com/v1_1/{cloud_name}/usage con Basic auth devuelve 401
    ''cloud_name mismatch'' -- confirmado en vivo 2026-08-07. El mensaje del proveedor indica que CLOUDINARY_CLOUD_NAME
    en el vault no corresponde a la cuenta de este api_key/api_secret (ese campo del vault hoy coincide
    caracter por caracter con CLOUDINARY_API_KEY, lo que sugiere un error de carga: alguien copio el api_key
    en el campo de cloud_name). No es un bug del validador -- el endpoint/auth son correctos. Hace falta
    que Cano corrija CLOUDINARY_CLOUD_NAME en el vault con el nombre real de la cuenta (visible en el
    dashboard de Cloudinary).'
- nombre: CLOUDINARY_API_SECRET
